<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SAT | Acceso al Sistema</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <script src="js/sat-common.js"></script>
    <style>
        body { font-family: 'Inter', sans-serif; }
        .glass { background: rgba(255, 255, 255, 0.97); backdrop-filter: blur(10px); }
    </style>
</head>
<body class="bg-gradient-to-br from-slate-900 via-blue-900 to-indigo-900 min-h-screen flex items-center justify-center p-4">
    <div x-data="loginApp()"
         class="glass w-full max-w-md p-8 rounded-2xl shadow-2xl border border-white/20">
        <div class="text-center mb-8">
            <div class="inline-flex items-center justify-center w-16 h-16 bg-blue-700 rounded-xl mb-4 shadow-lg">
                <i class="bi bi-shield-shaded text-white text-3xl"></i>
            </div>
            <h1 class="text-3xl font-bold text-gray-800">SAT</h1>
            <p class="text-gray-500 text-sm mt-2">Sistema de Administración Tributaria</p>
        </div>

        <div x-show="error" x-text="error"
             class="mb-4 p-3 bg-red-50 border border-red-200 text-red-600 rounded-lg text-sm text-center"></div>

        <form @submit.prevent="login()">
            <div class="space-y-4">
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1">Correo electrónico</label>
                    <input type="email" x-model="email" required autofocus
                           placeholder="admin@sat.local"
                           class="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition">
                </div>
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1">Contraseña</label>
                    <div class="relative">
                        <input :type="verPassword ? 'text' : 'password'" x-model="password" required
                               class="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition pr-10">
                        <button type="button" @click="verPassword = !verPassword"
                                class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-500">
                            <i :class="verPassword ? 'bi bi-eye-slash' : 'bi bi-eye'"></i>
                        </button>
                    </div>
                </div>
            </div>

            <button type="submit" :disabled="loading"
                    class="w-full mt-6 bg-blue-700 hover:bg-blue-800 text-white font-semibold py-2.5 rounded-lg transition disabled:opacity-50">
                <span x-show="!loading">Ingresar</span>
                <span x-show="loading">
                    <i class="bi bi-arrow-repeat animate-spin"></i> Validando...
                </span>
            </button>
        </form>

        <p class="text-xs text-gray-500 text-center mt-6">
            Conectado a <span class="font-mono" x-text="apiBase"></span>
        </p>
    </div>

    <script>
        function loginApp() {
            return {
                loading: false,
                email: '',
                password: '',
                verPassword: false,
                error: '',
                apiBase: SAT_API_BASE,
                async login() {
                    this.error = '';
                    this.loading = true;
                    try {
                        const res = await fetch(SAT_API_BASE + '/api/auth/login', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ email: this.email, password: this.password })
                        });
                        const data = await res.json();
                        if (!res.ok) {
                            this.error = data.error || 'No se pudo autenticar';
                            return;
                        }
                        setAuth({
                            idUsuario: data.idUsuario,
                            email: data.email,
                            nombres: data.nombres,
                            apellidos: data.apellidos,
                            tipoUsuario: data.tipoUsuario
                        }, data.token);
                        window.location.href = 'dashboard.html';
                    } catch (e) {
                        this.error = 'No se pudo contactar al backend (' + SAT_API_BASE + ')';
                    } finally {
                        this.loading = false;
                    }
                }
            };
        }
    </script>
</body>
</html>
