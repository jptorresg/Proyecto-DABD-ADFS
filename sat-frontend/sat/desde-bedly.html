<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SAT | Facturar desde Bedly</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/sat-style.css">
    <script src="js/sat-common.js"></script>
</head>
<body>
    <script>requireAuth(); renderSatLayout('bedly');</script>

    <main class="sat-main" x-data="bedlyApp()">
        <h1>Facturar reserva desde Bedly</h1>
        <p class="subtitulo">
            SAT consulta Bedly vía HTTP (<span class="font-mono text-xs" x-text="bedlyBase"></span>),
            calcula IVA 12% y emite la factura. Idempotente: si la reserva ya fue facturada, devuelve la existente.
        </p>

        <div class="max-w-3xl">
            <div class="bg-white p-6 rounded-xl shadow-sm space-y-4">
                <div class="flex gap-3">
                    <input type="number" x-model.number="idReserva" placeholder="ID de la reserva"
                           class="flex-grow border rounded-lg px-4 py-2.5 text-sm">
                    <button @click="facturar()" :disabled="loading || !idReserva"
                            class="bg-emerald-700 hover:bg-emerald-800 text-white font-semibold px-5 py-2.5 rounded-lg disabled:opacity-50 text-sm">
                        <span x-show="!loading"><i class="bi bi-link-45deg"></i> Facturar</span>
                        <span x-show="loading"><i class="bi bi-arrow-repeat animate-spin"></i></span>
                    </button>
                </div>

                <div x-show="error" x-text="error"
                     class="p-3 bg-red-50 border border-red-200 text-red-700 rounded-lg text-sm"></div>

                <div x-show="resultado" class="border-t pt-4">
                    <h2 class="font-semibold text-gray-800 mb-3">
                        <i class="bi bi-check-circle text-emerald-600"></i>
                        Factura <span x-text="resultado?.serie + '-' + resultado?.numero"></span>
                        (#<span x-text="resultado?.idFactura"></span>)
                    </h2>
                    <div class="grid grid-cols-2 gap-2 text-sm text-gray-700 mb-3">
                        <div>Subtotal:</div><div class="text-right font-mono" x-text="fmtMoney(resultado?.subtotal)"></div>
                        <div>IVA 12%:</div><div class="text-right font-mono text-amber-700" x-text="fmtMoney(resultado?.impuesto)"></div>
                        <div class="font-bold">Total:</div><div class="text-right font-mono font-bold text-blue-800" x-text="fmtMoney(resultado?.total)"></div>
                        <div class="text-xs text-gray-500">Referencia:</div><div class="text-right text-xs text-gray-500 font-mono" x-text="resultado?.referenciaExterna"></div>
                    </div>
                    <template x-if="resultado?.detalles?.length">
                        <ul class="text-xs text-gray-600 mb-3 ml-4 list-disc">
                            <template x-for="(d, i) in resultado.detalles" :key="i">
                                <li x-text="d.descripcion + ' - ' + d.cantidad + ' x ' + fmtMoney(d.precioUnitario)"></li>
                            </template>
                        </ul>
                    </template>
                    <button @click="downloadFile('/api/sat/facturas/' + resultado.idFactura + '/pdf', 'factura-' + resultado.serie + '-' + resultado.numero + '.pdf')"
                            class="bg-blue-700 text-white px-4 py-2 rounded-lg text-sm hover:bg-blue-800">
                        <i class="bi bi-file-earmark-pdf"></i> Descargar PDF
                    </button>
                </div>
            </div>
        </div>
    </main>

    <script>
        function bedlyApp() {
            return {
                bedlyBase: SAT_BEDLY_BASE,
                idReserva: null,
                loading: false,
                error: '',
                resultado: null,
                async facturar() {
                    this.error = ''; this.resultado = null; this.loading = true;
                    try {
                        this.resultado = await api('/api/sat/facturas/desde-bedly/' + this.idReserva, { method: 'POST' });
                    } catch (e) {
                        this.error = e.message;
                    } finally {
                        this.loading = false;
                    }
                }
            };
        }
    </script>
</body>
</html>
