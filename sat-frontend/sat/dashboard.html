<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SAT | Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/sat-style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="js/sat-common.js"></script>
</head>
<body>
    <script>requireAuth(); renderSatLayout('dashboard');</script>

    <main class="sat-main" x-data="dashboardApp()" x-init="load()">
        <h1>Dashboard</h1>
        <p class="subtitulo">Vista general de la facturación e impuestos recaudados.</p>

        <div x-show="loading" class="text-center py-12 text-gray-500">
            <i class="bi bi-arrow-repeat animate-spin text-3xl"></i>
            <p class="mt-2">Cargando estadísticas...</p>
        </div>

        <div x-show="!loading">
            <!-- KPI Cards -->
            <div class="grid grid-cols-2 md:grid-cols-4 gap-3 mb-5">
                <div class="bg-white p-4 rounded-xl shadow-sm border-l-4 border-blue-600">
                    <div class="flex items-center justify-between">
                        <p class="text-xs text-gray-500 uppercase font-semibold">Total Facturado</p>
                        <i class="bi bi-cash-stack text-blue-600 text-xl"></i>
                    </div>
                    <p class="text-xl md:text-2xl font-bold text-gray-800 mt-1" x-text="fmtMoney(stats.totalFacturado)"></p>
                </div>
                <div class="bg-white p-4 rounded-xl shadow-sm border-l-4 border-emerald-600">
                    <div class="flex items-center justify-between">
                        <p class="text-xs text-gray-500 uppercase font-semibold">Facturas</p>
                        <i class="bi bi-file-earmark-text text-emerald-600 text-xl"></i>
                    </div>
                    <p class="text-xl md:text-2xl font-bold text-gray-800 mt-1" x-text="stats.cantidadFacturas || 0"></p>
                </div>
                <div class="bg-white p-4 rounded-xl shadow-sm border-l-4 border-amber-600">
                    <div class="flex items-center justify-between">
                        <p class="text-xs text-gray-500 uppercase font-semibold">Emitidas</p>
                        <i class="bi bi-send text-amber-600 text-xl"></i>
                    </div>
                    <p class="text-xl md:text-2xl font-bold text-gray-800 mt-1" x-text="(stats.porEstado || {}).EMITIDA || 0"></p>
                </div>
                <div class="bg-white p-4 rounded-xl shadow-sm border-l-4 border-rose-600">
                    <div class="flex items-center justify-between">
                        <p class="text-xs text-gray-500 uppercase font-semibold">Anuladas</p>
                        <i class="bi bi-x-circle text-rose-600 text-xl"></i>
                    </div>
                    <p class="text-xl md:text-2xl font-bold text-gray-800 mt-1" x-text="(stats.porEstado || {}).ANULADA || 0"></p>
                </div>
            </div>

            <!-- Charts row -->
            <div class="grid grid-cols-1 lg:grid-cols-3 gap-4 mb-4">
                <div class="lg:col-span-2 bg-white p-4 rounded-xl shadow-sm">
                    <h2 class="font-semibold text-gray-700 text-sm mb-2">
                        <i class="bi bi-bar-chart-line text-blue-600"></i> Ingresos por mes (últimos 6)
                    </h2>
                    <div style="height: 220px;">
                        <canvas id="chartIngresos"></canvas>
                    </div>
                </div>
                <div class="bg-white p-4 rounded-xl shadow-sm">
                    <h2 class="font-semibold text-gray-700 text-sm mb-2">
                        <i class="bi bi-pie-chart text-emerald-600"></i> Por tipo de proveedor
                    </h2>
                    <div style="height: 220px; display: flex; align-items: center; justify-content: center;">
                        <canvas id="chartTipoEmisor"></canvas>
                    </div>
                </div>
            </div>

            <div class="grid grid-cols-1 lg:grid-cols-3 gap-4">
                <div class="bg-white p-4 rounded-xl shadow-sm">
                    <h2 class="font-semibold text-gray-700 text-sm mb-2">
                        <i class="bi bi-flag text-indigo-600"></i> Facturas por estado
                    </h2>
                    <div style="height: 200px; display: flex; align-items: center; justify-content: center;">
                        <canvas id="chartEstado"></canvas>
                    </div>
                </div>
                <div class="lg:col-span-2 bg-white p-4 rounded-xl shadow-sm">
                    <h2 class="font-semibold text-gray-700 text-sm mb-3">
                        <i class="bi bi-lightning text-amber-600"></i> Acciones rápidas
                    </h2>
                    <div class="grid grid-cols-1 sm:grid-cols-3 gap-2">
                        <a href="crear-factura.html"
                           class="block bg-blue-700 text-white text-center py-3 rounded-lg hover:bg-blue-800 text-sm font-medium">
                            <i class="bi bi-plus-circle text-lg"></i><br>Nueva factura
                        </a>
                        <a href="desde-bedly.html"
                           class="block bg-emerald-700 text-white text-center py-3 rounded-lg hover:bg-emerald-800 text-sm font-medium">
                            <i class="bi bi-link-45deg text-lg"></i><br>Facturar Bedly
                        </a>
                        <a href="reportes.html"
                           class="block bg-indigo-700 text-white text-center py-3 rounded-lg hover:bg-indigo-800 text-sm font-medium">
                            <i class="bi bi-file-earmark-pdf text-lg"></i><br>Reportes PDF
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script>
        function dashboardApp() {
            return {
                loading: true,
                stats: {},
                async load() {
                    try {
                        this.stats = await api('/api/sat/reportes/stats');
                        this.loading = false;
                        this.$nextTick(() => this.drawCharts());
                    } catch (e) {
                        this.loading = false;
                        alert(e.message);
                    }
                },
                drawCharts() {
                    Chart.defaults.maintainAspectRatio = false;
                    Chart.defaults.responsive = true;

                    const ipm = this.stats.ingresosPorMes || [];
                    new Chart(document.getElementById('chartIngresos'), {
                        type: 'bar',
                        data: {
                            labels: ipm.map(x => x.mes),
                            datasets: [{
                                label: 'Total facturado (Q)',
                                data: ipm.map(x => Number(x.total)),
                                backgroundColor: 'rgba(37, 99, 235, 0.7)',
                                borderRadius: 6
                            }]
                        },
                        options: { plugins: { legend: { display: false } } }
                    });

                    const tpe = this.stats.totalPorTipoEmisor || [];
                    new Chart(document.getElementById('chartTipoEmisor'), {
                        type: 'doughnut',
                        data: {
                            labels: tpe.map(x => x.tipo),
                            datasets: [{
                                data: tpe.map(x => Number(x.total)),
                                backgroundColor: ['#2563eb', '#059669', '#7c3aed', '#dc2626']
                            }]
                        },
                        options: { plugins: { legend: { position: 'bottom', labels: { font: { size: 11 } } } } }
                    });

                    const pe = this.stats.porEstado || {};
                    new Chart(document.getElementById('chartEstado'), {
                        type: 'doughnut',
                        data: {
                            labels: Object.keys(pe),
                            datasets: [{
                                data: Object.values(pe),
                                backgroundColor: ['#f59e0b', '#10b981', '#ef4444']
                            }]
                        },
                        options: { plugins: { legend: { position: 'bottom', labels: { font: { size: 11 } } } } }
                    });
                }
            };
        }
    </script>
</body>
</html>
