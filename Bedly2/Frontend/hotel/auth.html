<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bedly | Acceso al Sistema</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <style>
        :root { --primary-color: #003580; }
        body {
            font-family: 'DM Sans', sans-serif;
            background: linear-gradient(135deg, #003580 0%, #0055b3 50%, #14b8a6 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .navbar-bedly { background-color: rgba(0,53,128,0.95); padding: 0.75rem 0; backdrop-filter: blur(10px); }
        .brand { font-family: 'Playfair Display', serif; font-size: 1.8rem; font-weight: 900; color: #fff; text-decoration: none; }
        .brand span { color: #f5a623; }

        .auth-container {
            flex-grow: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem 1rem;
        }
        .auth-card {
            background: rgba(255, 255, 255, 0.97);
            backdrop-filter: blur(12px);
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.25);
            max-width: 480px;
            width: 100%;
            overflow: hidden;
        }
        .auth-header {
            background: var(--primary-color);
            color: white;
            padding: 2rem;
            text-align: center;
        }
        .auth-logo {
            width: 60px; height: 60px;
            background: rgba(255,255,255,0.15);
            border-radius: 14px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 1.8rem;
            margin-bottom: 1rem;
            border: 2px solid rgba(255,255,255,0.3);
        }
        .auth-title {
            font-family: 'Playfair Display', serif;
            font-size: 2rem;
            font-weight: 900;
            margin: 0;
        }
        .auth-subtitle { font-size: 0.9rem; opacity: 0.85; margin-top: 0.25rem; }

        .tabs-nav {
            display: flex;
            border-bottom: 2px solid #e5e7eb;
            background: #f9fafb;
        }
        .tab-btn {
            flex: 1;
            background: none;
            border: none;
            padding: 1rem;
            font-weight: 600;
            font-size: 0.95rem;
            color: #6b7280;
            cursor: pointer;
            transition: all 0.2s;
            border-bottom: 3px solid transparent;
            margin-bottom: -2px;
        }
        .tab-btn.active {
            color: var(--primary-color);
            border-bottom-color: var(--primary-color);
            background: white;
        }
        .tab-btn:hover:not(.active) { background: #f3f4f6; color: #374151; }

        .auth-body { padding: 2rem; }

        .form-label-bedly {
            font-size: 0.78rem;
            font-weight: 700;
            color: #6b7280;
            text-transform: uppercase;
            letter-spacing: 0.04em;
        }
        .form-control, .form-select {
            border: 1.5px solid #e5e7eb;
            border-radius: 10px;
            padding: 0.65rem 0.9rem;
            font-family: 'DM Sans', sans-serif;
        }
        .form-control:focus, .form-select:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(0,53,128,0.1);
        }
        .btn-bedly {
            background: var(--primary-color);
            color: white;
            border-radius: 10px;
            padding: 0.8rem;
            font-weight: 700;
            font-size: 1rem;
            border: none;
            transition: all 0.2s;
            width: 100%;
        }
        .btn-bedly:hover:not(:disabled) { background: #002d6a; color: white; }
        .btn-bedly:disabled { opacity: 0.6; cursor: not-allowed; }

        .password-wrapper { position: relative; }
        .password-toggle {
            position: absolute;
            right: 0.9rem;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: #9ca3af;
            cursor: pointer;
            padding: 0;
        }
        .password-toggle:hover { color: var(--primary-color); }

        .auth-divider {
            display: flex;
            align-items: center;
            margin: 1.5rem 0;
            color: #9ca3af;
            font-size: 0.78rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        .auth-divider::before, .auth-divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: #e5e7eb;
        }
        .auth-divider::before { margin-right: 0.75rem; }
        .auth-divider::after { margin-left: 0.75rem; }

        .btn-google {
            width: 100%;
            background: white;
            border: 1.5px solid #e5e7eb;
            border-radius: 10px;
            padding: 0.7rem;
            font-weight: 600;
            color: #374151;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.75rem;
            transition: all 0.2s;
            cursor: pointer;
        }
        .btn-google:hover { background: #f9fafb; border-color: #9ca3af; }
        .btn-google img { width: 20px; height: 20px; }

        .form-text-hint { font-size: 0.75rem; color: #9ca3af; margin-top: 0.25rem; }

        .captcha-box {
            background: #f0f4f8;
            border: 2px dashed #cbd5e1;
            border-radius: 10px;
            padding: 1rem;
            text-align: center;
        }
        .captcha-question {
            font-family: 'Playfair Display', serif;
            font-size: 1.3rem;
            font-weight: 900;
            color: var(--primary-color);
        }

        footer {
            background: rgba(0,0,0,0.2);
            color: white;
            padding: 1rem 0;
            text-align: center;
            font-size: 0.82rem;
            opacity: 0.85;
        }
    </style>
</head>
<body x-data="authApp()" x-init="init()">

    <nav class="navbar-bedly">
        <div class="container d-flex justify-content-between align-items-center">
            <a class="brand" href="landing.html">Bed<span>ly</span></a>
            <a href="landing.html" class="btn btn-outline-light btn-sm rounded-pill px-3">
                <i class="bi bi-house me-1"></i>Inicio
            </a>
        </div>
    </nav>

    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <div class="auth-logo"><i class="bi bi-building"></i></div>
                <h1 class="auth-title">Bedly</h1>
                <p class="auth-subtitle">Sistema de Gestión Hotelera</p>
            </div>

            <div class="tabs-nav">
                <button class="tab-btn" :class="vista === 'login' ? 'active' : ''" @click="cambiarVista('login')">
                    <i class="bi bi-box-arrow-in-right me-1"></i>Iniciar Sesión
                </button>
                <button class="tab-btn" :class="vista === 'registro' ? 'active' : ''" @click="cambiarVista('registro')">
                    <i class="bi bi-person-plus me-1"></i>Registrarse
                </button>
            </div>

            <div class="auth-body">

                <!-- Mensajes globales -->
                <div x-show="error" class="alert alert-danger small" x-text="error"></div>
                <div x-show="exito" class="alert alert-success small" x-text="exito"></div>

                <!-- ============ FORMULARIO LOGIN ============ -->
                <div x-show="vista === 'login'" x-transition>
                    <form @submit.prevent="login()">
                        <div class="mb-3">
                            <label class="form-label form-label-bedly">
                                <i class="bi bi-envelope me-1"></i>Correo electrónico
                            </label>
                            <input type="email" class="form-control" x-model="formLogin.email"
                                   placeholder="tu@email.com" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label form-label-bedly">
                                <i class="bi bi-lock me-1"></i>Contraseña
                            </label>
                            <div class="password-wrapper">
                                <input :type="verPasswordLogin ? 'text' : 'password'"
                                       class="form-control" x-model="formLogin.password"
                                       placeholder="Tu contraseña" required>
                                <button type="button" class="password-toggle"
                                        @click="verPasswordLogin = !verPasswordLogin">
                                    <i :class="verPasswordLogin ? 'bi bi-eye-slash' : 'bi bi-eye'"></i>
                                </button>
                            </div>
                        </div>

                        <div class="d-flex justify-content-between align-items-center mb-4">
                            <label class="form-check d-flex align-items-center gap-2 mb-0">
                                <input type="checkbox" class="form-check-input m-0" x-model="recordarme">
                                <span class="small text-muted">Recordarme</span>
                            </label>
                            <a href="#" class="small" style="color:var(--primary-color); font-weight:600;">
                                ¿Olvidaste tu contraseña?
                            </a>
                        </div>

                        <button type="submit" class="btn-bedly" :disabled="cargando">
                            <span x-show="!cargando">
                                <i class="bi bi-box-arrow-in-right me-2"></i>Iniciar Sesión
                            </span>
                            <span x-show="cargando">
                                <span class="spinner-border spinner-border-sm me-2"></span>Iniciando...
                            </span>
                        </button>
                    </form>

                    <div class="auth-divider">O continúa con</div>

                    <button class="btn-google">
                        <img src="https://upload.wikimedia.org/wikipedia/commons/5/53/Google_%22G%22_Logo.svg" alt="Google">
                        Continuar con Google
                    </button>

                    <p class="text-center text-muted small mt-4 mb-0">
                        ¿No tienes cuenta?
                        <a href="#" @click.prevent="cambiarVista('registro')"
                           style="color:var(--primary-color); font-weight:600;">Regístrate aquí</a>
                    </p>
                </div>

                <!-- ============ FORMULARIO REGISTRO ============ -->
                <div x-show="vista === 'registro'" x-transition>
                    <form @submit.prevent="registrar()">
                        <div class="row g-2">
                            <div class="col-6">
                                <label class="form-label form-label-bedly">
                                    <i class="bi bi-person me-1"></i>Nombre *
                                </label>
                                <input type="text" class="form-control" x-model="formRegistro.nombre"
                                       placeholder="José" required>
                            </div>
                            <div class="col-6">
                                <label class="form-label form-label-bedly">
                                    <i class="bi bi-person-badge me-1"></i>Apellidos *
                                </label>
                                <input type="text" class="form-control" x-model="formRegistro.apellidos"
                                       placeholder="Rueda Méndez" required>
                            </div>
                            <div class="col-12">
                                <label class="form-label form-label-bedly">
                                    <i class="bi bi-envelope me-1"></i>Email *
                                </label>
                                <input type="email" class="form-control" x-model="formRegistro.email"
                                       placeholder="tu@email.com" required>
                            </div>
                            <div class="col-6">
                                <label class="form-label form-label-bedly">
                                    <i class="bi bi-cake2 me-1"></i>Edad *
                                </label>
                                <input type="number" class="form-control" x-model.number="formRegistro.edad"
                                       min="18" max="120" placeholder="25" required>
                            </div>
                            <div class="col-6">
                                <label class="form-label form-label-bedly">
                                    <i class="bi bi-telephone me-1"></i>Teléfono *
                                </label>
                                <input type="text" class="form-control" :value="formRegistro.telefono"
                                       @input="formatearTelefono($event)"
                                       maxlength="9" placeholder="0000-0000" required>
                            </div>
                            <div class="col-12">
                                <label class="form-label form-label-bedly">
                                    <i class="bi bi-flag me-1"></i>País *
                                </label>
                                <select class="form-select" x-model="formRegistro.pais" required>
                                    <option value="">Selecciona tu país...</option>
                                    <template x-for="p in paises" :key="p.codigo">
                                        <option :value="p.nombre" x-text="p.nombre"></option>
                                    </template>
                                </select>
                            </div>
                            <div class="col-12">
                                <label class="form-label form-label-bedly">
                                    <i class="bi bi-card-text me-1"></i>Documento *
                                </label>
                                <select class="form-select mb-2" x-model="tipoDocumento"
                                        @change="formRegistro.pasaporte = ''">
                                    <option value="dpi">DPI (Guatemala)</option>
                                    <option value="pasaporte">Pasaporte</option>
                                </select>
                                <input type="text" class="form-control"
                                       :value="formRegistro.pasaporte"
                                       @input="formatearDocumento($event)"
                                       :maxlength="tipoDocumento === 'dpi' ? 13 : 9"
                                       :placeholder="tipoDocumento === 'dpi' ? '13 dígitos' : 'AB1234567'"
                                       required>
                                <div class="form-text-hint" x-show="tipoDocumento === 'dpi'">
                                    DPI guatemalteco: 13 dígitos exactos
                                </div>
                                <div class="form-text-hint" x-show="tipoDocumento === 'pasaporte'">
                                    Pasaporte: 6 a 9 caracteres alfanuméricos
                                </div>
                            </div>
                            <div class="col-12">
                                <label class="form-label form-label-bedly">
                                    <i class="bi bi-lock me-1"></i>Contraseña *
                                </label>
                                <div class="password-wrapper">
                                    <input :type="verPasswordRegistro ? 'text' : 'password'"
                                           class="form-control" x-model="formRegistro.password"
                                           placeholder="Mínimo 8 caracteres" required>
                                    <button type="button" class="password-toggle"
                                            @click="verPasswordRegistro = !verPasswordRegistro">
                                        <i :class="verPasswordRegistro ? 'bi bi-eye-slash' : 'bi bi-eye'"></i>
                                    </button>
                                </div>
                            </div>
                            <div class="col-12">
                                <label class="form-label form-label-bedly">
                                    <i class="bi bi-shield-check me-1"></i>Verificación *
                                </label>
                                <div class="captcha-box">
                                    <div class="captcha-question mb-2">
                                        <span x-text="captcha.a"></span> + <span x-text="captcha.b"></span> = ?
                                        <button type="button" class="btn btn-sm btn-link p-0 ms-2"
                                                @click="generarCaptcha()" title="Cambiar pregunta">
                                            <i class="bi bi-arrow-clockwise"></i>
                                        </button>
                                    </div>
                                    <input type="number" class="form-control text-center"
                                           style="max-width:160px; margin:auto;"
                                           x-model.number="captchaRespuesta"
                                           placeholder="Tu respuesta"
                                           min="0" max="20" step="1" required>
                                </div>
                            </div>
                            <div class="col-12">
                                <div class="form-check small">
                                    <input class="form-check-input" type="checkbox" id="terminos"
                                           x-model="aceptaTerminos" required>
                                    <label class="form-check-label" for="terminos">
                                        Acepto los
                                        <a href="#" style="color:var(--primary-color);">Términos</a> y
                                        la <a href="#" style="color:var(--primary-color);">Política de Privacidad</a>.
                                    </label>
                                </div>
                            </div>
                            <div class="col-12 mt-3">
                                <button type="submit" class="btn-bedly" :disabled="cargando">
                                    <span x-show="!cargando">
                                        <i class="bi bi-person-plus me-2"></i>Crear cuenta
                                    </span>
                                    <span x-show="cargando">
                                        <span class="spinner-border spinner-border-sm me-2"></span>Creando...
                                    </span>
                                </button>
                            </div>
                        </div>
                    </form>

                    <p class="text-center text-muted small mt-4 mb-0">
                        ¿Ya tienes cuenta?
                        <a href="#" @click.prevent="cambiarVista('login')"
                           style="color:var(--primary-color); font-weight:600;">Inicia sesión</a>
                    </p>
                </div>

            </div>
        </div>
    </div>

    <footer>
        <div class="container">
            © 2026 Bedly — Sistema de Gestión Hotelera · UNIS
        </div>
    </footer>

    <script>
    const API = 'http://localhost:5043/api';

    function authApp() {
        return {
            vista: 'login',
            error: '',
            exito: '',
            cargando: false,

            // Login
            formLogin: { email: '', password: '' },
            recordarme: false,
            verPasswordLogin: false,

            // Registro
            formRegistro: {
                nombre: '', apellidos: '', email: '', password: '',
                telefono: '', edad: null, pais: '', pasaporte: ''
            },
            tipoDocumento: 'dpi',
            verPasswordRegistro: false,
            aceptaTerminos: false,
            captcha: { a: 0, b: 0, resultado: 0 },
            captchaRespuesta: null,
            paises: [
                { codigo: 'GT', nombre: 'Guatemala' },
                { codigo: 'MX', nombre: 'México' },
                { codigo: 'US', nombre: 'Estados Unidos' },
                { codigo: 'CA', nombre: 'Canadá' },
                { codigo: 'HN', nombre: 'Honduras' },
                { codigo: 'SV', nombre: 'El Salvador' },
                { codigo: 'NI', nombre: 'Nicaragua' },
                { codigo: 'CR', nombre: 'Costa Rica' },
                { codigo: 'PA', nombre: 'Panamá' },
                { codigo: 'BZ', nombre: 'Belice' },
                { codigo: 'CO', nombre: 'Colombia' },
                { codigo: 'VE', nombre: 'Venezuela' },
                { codigo: 'EC', nombre: 'Ecuador' },
                { codigo: 'PE', nombre: 'Perú' },
                { codigo: 'BO', nombre: 'Bolivia' },
                { codigo: 'CL', nombre: 'Chile' },
                { codigo: 'AR', nombre: 'Argentina' },
                { codigo: 'UY', nombre: 'Uruguay' },
                { codigo: 'PY', nombre: 'Paraguay' },
                { codigo: 'BR', nombre: 'Brasil' },
                { codigo: 'ES', nombre: 'España' },
                { codigo: 'FR', nombre: 'Francia' },
                { codigo: 'DE', nombre: 'Alemania' },
                { codigo: 'IT', nombre: 'Italia' },
                { codigo: 'GB', nombre: 'Reino Unido' },
                { codigo: 'PT', nombre: 'Portugal' },
                { codigo: 'NL', nombre: 'Países Bajos' },
                { codigo: 'JP', nombre: 'Japón' },
                { codigo: 'CN', nombre: 'China' },
                { codigo: 'KR', nombre: 'Corea del Sur' },
                { codigo: 'IN', nombre: 'India' },
                { codigo: 'AU', nombre: 'Australia' },
                { codigo: 'OTHER', nombre: 'Otro' }
            ],

            init() {
                // Si ya hay sesión, cerrar y quedarse en esta página
                localStorage.removeItem('usuario');

                // Detectar si la URL pide vista de registro: auth.html?vista=registro
                const params = new URLSearchParams(window.location.search);
                if (params.get('vista') === 'registro') this.vista = 'registro';

                // Email recordado
                const emailGuardado = localStorage.getItem('bedly_email');
                if (emailGuardado) {
                    this.formLogin.email = emailGuardado;
                    this.recordarme = true;
                }

                this.generarCaptcha();
                this.cargarPaises();
            },

            cambiarVista(v) {
                this.vista = v;
                this.error = '';
                this.exito = '';
            },

            generarCaptcha() {
                this.captcha.a = Math.floor(Math.random() * 10) + 1;
                this.captcha.b = Math.floor(Math.random() * 10) + 1;
                this.captcha.resultado = this.captcha.a + this.captcha.b;
                this.captchaRespuesta = null;
            },

            async cargarPaises() {
                try {
                    const res = await fetch(`${API}/catalogo/nacionalidades`);
                    if (!res.ok) return;
                    const data = await res.json();
                    if (data.success && Array.isArray(data.data) && data.data.length > 0) {
                        this.paises = data.data;
                    }
                } catch (e) { /* fallback hardcoded */ }
            },

            formatearTelefono(event) {
                let valor = event.target.value.replace(/\D/g, '');
                if (valor.length > 8) valor = valor.substring(0, 8);
                if (valor.length > 4) {
                    valor = valor.substring(0, 4) + '-' + valor.substring(4);
                }
                this.formRegistro.telefono = valor;
                event.target.value = valor;
            },

            formatearDocumento(event) {
                let valor = event.target.value;
                if (this.tipoDocumento === 'dpi') {
                    valor = valor.replace(/\D/g, '').substring(0, 13);
                } else {
                    valor = valor.toUpperCase().replace(/[^A-Z0-9]/g, '').substring(0, 9);
                }
                this.formRegistro.pasaporte = valor;
                event.target.value = valor;
            },

            // ===== LOGIN =====
            async login() {
                this.error = '';
                this.exito = '';
                this.cargando = true;
                try {
                    const res = await fetch(`${API}/auth/login`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            email: this.formLogin.email,
                            password: this.formLogin.password
                        })
                    });
                    const data = await res.json();
                    if (data.success) {
                        localStorage.setItem('usuario', JSON.stringify(data.data));
                        if (this.recordarme) {
                            localStorage.setItem('bedly_email', this.formLogin.email);
                        } else {
                            localStorage.removeItem('bedly_email');
                        }
                        const rol = data.data.rol;
                        const rolesAdmin = ['superadmin', 'admin', 'recepcionista', 'auditor'];
                        window.location.href = rolesAdmin.includes(rol) ? 'admin.html' : 'index.html';
                    } else {
                        this.error = data.message || 'Credenciales incorrectas.';
                    }
                } catch (e) {
                    this.error = 'Error al conectar con el servidor.';
                } finally {
                    this.cargando = false;
                }
            },

            // ===== REGISTRO =====
            validarRegistro() {
                if (!this.formRegistro.nombre || !this.formRegistro.apellidos) {
                    this.error = 'Nombre y apellidos son requeridos.';
                    return false;
                }
                if (!this.formRegistro.email.includes('@')) {
                    this.error = 'Email inválido.';
                    return false;
                }
                if (!this.formRegistro.edad || this.formRegistro.edad < 18 || this.formRegistro.edad > 120) {
                    this.error = 'La edad debe estar entre 18 y 120 años.';
                    return false;
                }
                const telefonoLimpio = this.formRegistro.telefono.replace(/\D/g, '');
                if (telefonoLimpio.length !== 8) {
                    this.error = 'El teléfono debe tener 8 dígitos.';
                    return false;
                }
                if (!this.formRegistro.pais) {
                    this.error = 'Selecciona un país.';
                    return false;
                }
                if (this.tipoDocumento === 'dpi') {
                    if (!/^\d{13}$/.test(this.formRegistro.pasaporte)) {
                        this.error = 'El DPI debe tener exactamente 13 dígitos.';
                        return false;
                    }
                } else {
                    if (!/^[A-Z0-9]{6,9}$/.test(this.formRegistro.pasaporte)) {
                        this.error = 'El pasaporte debe tener entre 6 y 9 caracteres alfanuméricos.';
                        return false;
                    }
                }
                if (this.formRegistro.password.length < 8) {
                    this.error = 'La contraseña debe tener al menos 8 caracteres.';
                    return false;
                }
                if (this.captchaRespuesta !== this.captcha.resultado) {
                    this.error = 'La respuesta del CAPTCHA es incorrecta.';
                    this.generarCaptcha();
                    return false;
                }
                if (!this.aceptaTerminos) {
                    this.error = 'Debes aceptar los términos y condiciones.';
                    return false;
                }
                return true;
            },

            async registrar() {
                this.error = '';
                this.exito = '';
                if (!this.validarRegistro()) return;

                this.cargando = true;
                try {
                    const res = await fetch(`${API}/auth/registro`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(this.formRegistro)
                    });
                    const data = await res.json();
                    if (data.success) {
                        this.exito = 'Cuenta creada exitosamente. Iniciando sesión...';
                        // Auto-login
                        this.formLogin.email = this.formRegistro.email;
                        this.formLogin.password = this.formRegistro.password;
                        setTimeout(() => this.login(), 1200);
                    } else {
                        this.error = data.message || 'Error al crear la cuenta.';
                        this.generarCaptcha();
                    }
                } catch (e) {
                    this.error = 'No se pudo conectar al servidor.';
                    this.generarCaptcha();
                } finally {
                    this.cargando = false;
                }
            }
        }
    }
    </script>
